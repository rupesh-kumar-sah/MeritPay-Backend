name: Bug report
description: Something in the API behaves incorrectly
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing a bug. For **security vulnerabilities**, do not use this form —
        see [SECURITY.md](https://github.com/MeritPay/MeritPay-Backend/blob/main/SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the incorrect behavior.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Exact requests — `curl` commands or a script — plus the responses you got.
      render: shell
    validations:
      required: true
  - type: input
    id: endpoint
    attributes:
      label: Affected endpoint(s)
      placeholder: "POST /epochs"
    validations:
      required: false
  - type: textarea
    id: env
    attributes:
      label: Environment
      description: Node version (`node -v`), OS, database (SQLite default / Postgres), commit SHA (`git rev-parse HEAD`).
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Server output around the failure. Redact any secrets.
      render: shell
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues for a duplicate
          required: true
        - label: This is not a security vulnerability (those go through SECURITY.md)
          required: true
